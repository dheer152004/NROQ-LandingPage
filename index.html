<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>NROQ - Master Every Word</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />

    <meta
      name="description"
      content="NROQ helps you discover, understand, and master words through visual and interactive vocabulary learning."
    />

    <meta name="robots" content="index, follow" />

    <link rel="canonical" href="https://nroq.in/" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="NROQ - Master Every Word" />
    <meta
      property="og:description"
      content="Discover, understand, and master words through visual and interactive vocabulary learning."
    />
    <meta property="og:url" content="https://nroq.in/" />
    <meta property="og:site_name" content="NROQ" />

    <!-- Add this once you have a suitable 1200×630 image -->
    <meta
      property="og:image"
      content="https://nroq.in/og-image.png"
    />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="NROQ - Master Every Word" />
    <meta
      name="twitter:description"
      content="Discover, understand, and master words through visual and interactive vocabulary learning."
    />
    <meta
      name="twitter:image"
      content="https://nroq.in/og-image.png"
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Sora:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Structured data -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "NROQ",
        "url": "https://nroq.in/",
        "description": "NROQ helps you discover, understand, and master words through visual and interactive vocabulary learning."
      }
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
